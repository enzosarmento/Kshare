name: Release KShare

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag/versao da release (ex: v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-linux-and-android:
    name: Build Linux (.deb), Android (.apk) & Server JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias de empacotamento Debian
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolver versao da release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Garantir permissoes e validar estrutura
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/check-structure.sh

      - name: Executar testes Desktop e conformidade FSAP/1.0
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Executar testes unitarios Android
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: Gerar APK Android, Linux (.deb) e JAR Desktop
        run: ./scripts/prepare-release-assets.sh "${RELEASE_VERSION}" linux-and-android

      - name: Enviar artefatos Linux e Android
        uses: actions/upload-artifact@v4
        with:
          name: kshare-linux-android
          path: |
            dist/kshare-android.apk
            dist/kshare-linux-amd64.deb
            dist/kshare-server-all.jar
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop (.msi & portable .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolver versao da release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Compilar e testar Desktop no Windows
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Gerar instalador (.msi) e versao portavel (.zip) Windows
        shell: bash
        run: ./scripts/prepare-release-assets.sh "${RELEASE_VERSION}" windows-gui

      - name: Enviar artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: kshare-windows
          path: |
            dist/kshare-windows-x64.msi
            dist/kshare-windows-x64-portable.zip
          if-no-files-found: error

  publish-release:
    name: Publicar GitHub Release Multiplataforma
    needs: [build-linux-and-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Resolver versao da release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Baixar artefatos Linux e Android
        uses: actions/download-artifact@v4
        with:
          name: kshare-linux-android
          path: dist

      - name: Baixar artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: kshare-windows
          path: dist

      - name: Gerar SHA256SUMS.txt consolidado
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          cd dist
          sha256sum kshare-android.apk kshare-linux-amd64.deb kshare-windows-x64.msi kshare-windows-x64-portable.zip kshare-server-all.jar > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publicar GitHub Release com todos os binarios
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: "KShare ${{ env.RELEASE_VERSION }}"
          generate_release_notes: true
          files: |
            dist/kshare-android.apk
            dist/kshare-linux-amd64.deb
            dist/kshare-windows-x64.msi
            dist/kshare-windows-x64-portable.zip
            dist/kshare-server-all.jar
            dist/SHA256SUMS.txt
