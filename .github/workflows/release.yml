name: Release KShare

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag/versao da release (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolver versao da release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Garantir permissoes e validar estrutura
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/check-structure.sh

      - name: Executar testes Desktop e conformidade FSAP/1.0
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Executar testes unitarios Android
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: Gerar APK Android, JAR Desktop e SHA256SUMS
        run: ./scripts/prepare-release-assets.sh "${RELEASE_VERSION}"

      - name: Publicar GitHub Release com binarios anexados
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: "KShare ${{ env.RELEASE_VERSION }}"
          generate_release_notes: true
          files: |
            dist/kshare-android-*.apk
            dist/kshare-server-*-all.jar
            dist/SHA256SUMS.txt

